[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdocs-backend"
version = "0.1.0"
description = "Local-first, evidence-aware document intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "chromadb==0.5.23",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pymupdf==1.25.1",
  # PP-OCR models via ONNX with the weights inside the wheel: same accuracy
  # as PaddleOCR without the paddlex tree (langchain, openai, pandas), and
  # no first-run download.
  "rapidocr-onnxruntime==1.4.4",
  "pytesseract==0.3.13",
  "pillow==11.1.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
# The upstream Paddle runtime, for anyone who wants it instead of ONNX.
# Heavy: pulls paddlex and its transitive tree.
paddle = [
  "paddlepaddle==3.0.0",
  "paddleocr==3.7.0",
]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.6",
  "mypy==1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract", "openpyxl", "pptx", "paddleocr", "rapidocr_onnxruntime", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

